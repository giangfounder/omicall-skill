<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Realtime - Singae T9 2026</title>
<style>
  body{font-family:Segoe UI,Roboto,Arial,sans-serif;background:#0f1420;color:#e6e9f0;margin:0;padding:24px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#8b93a7;font-size:13px;margin-bottom:20px}
  .card{background:#1a2130;border:1px solid #2a3346;border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:#7fd1ff;text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #252e40;font-family:Consolas,monospace}
  th{color:#8b93a7;font-weight:600}
  .ok{color:#5fe08a}.warn{color:#ffd75e}.bad{color:#ff7b7b}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-right:6px}
  .tag-b{background:#123a5c;color:#7fd1ff}.tag-a{background:#3a2d12;color:#ffd75e}.tag-e{background:#3d1521;color:#ff8a9c}
  .blink{animation:bl 1.2s infinite}
  @keyframes bl{50%{opacity:.25}}
  .live{color:#5fe08a;font-size:12px;font-weight:700}
</style>
</head>
<body>
<h1>Singae T9 2026 <span id="ver" class="tag tag-b">?</span></h1>
<div class="sub" id="meta">Đang tải…</div>
<div id="wrap"></div>
<script>
let last=null;
async function tick(){
  try{
    const r=await fetch('status.json?v='+Date.now());
    const d=await r.json();
    render(d);
  }catch(e){
    document.getElementById('wrap').innerHTML='<div class="card"><h2>Trạng thái</h2><p class="bad">Không kết nối được status.json — chờ…</p></div>';
  }
}
function render(d){
  const p=d.payload||{};
  document.getElementById('ver').textContent='v'+(p.version??'?');
  const pub=p.is_publish?'<span class="live">PUBLISHED</span>':'<span class="bad">draft</span>';
  document.getElementById('meta').innerHTML=
    'id: <b>'+p.id+'</b> &nbsp;·&nbsp; '+pub+' &nbsp;·&nbsp; cập nhật: '+d.ts+
    '<br>Editor: <a style="color:#7fd1ff" href="https://giangnh2.omicrm.io/ai/callbot/script/update/'+p.id+'?lng=vi" target="_blank">mở editor</a>';
  const nodes=p.nodes||[];
  const orgs=p.org_nodes||[];
  const conns=p.connections||[];
  let h='';
  h+='<div class="card"><h2>Runtime nodes ('+nodes.length+')</h2>';
  h+='<table><tr><th>ID</th><th>Loại</th><th>Config</th></tr>';
  for(const n of nodes){
    const t=n.node_type;
    const cls=t==='BEGIN'?'tag-b':t==='ACTION'?'tag-a':'tag-e';
    let cfg='';
    if(t==='BEGIN') cfg=Object.keys(n.ai_agent_config||{}).join(', ');
    if(t==='ACTION') cfg=(n.actions||[]).map(a=>a.type).join(', ')||'—';
    h+='<tr><td>'+n.id+'</td><td><span class="tag '+cls+'">'+t+'</span></td><td>'+cfg+'</td></tr>';
  }
  h+='</table></div>';
  let an=null;
  if(nodes[0]&&nodes[0].ai_agent_config) an=nodes[0].ai_agent_config.ai_analyze;
  if(an){
    h+='<div class="card"><h2>Ý định → next node</h2><table><tr><th>ID</th><th>next_node</th></tr>';
    const name={WpXN6XFW9x:'BEGIN (vòng kịch bản)',sgxA1Fwd:'Chuyển NV 100',SO1vyn4EUb:'CÚP MÁY'};
    for(const c of an.conditions||[]){
      const nn=c.next_node?name[c.next_node]||c.next_node:'—';
      h+='<tr><td>'+c.id+'</td><td>'+nn+'</td></tr>';
    }
    h+='</table></div>';
  }
  h+='<div class="card"><h2>Connections ('+conns.length+')</h2><table><tr><th>Source</th><th>Handle</th><th>→ Target</th></tr>';
  for(const c of conns) h+='<tr><td>'+c.source+'</td><td>'+c.sourceHandle+'</td><td class="ok">'+c.target+'</td></tr>';
  h+='</table></div>';
  h+='<div class="card"><h2>Editor nodes (org_nodes, '+orgs.length+')</h2><table><tr><th>ID</th><th>Type</th><th>Pos</th></tr>';
  for(const o of orgs){
    const t=o.type; const cls=t==='BEGIN'?'tag-b':t==='ACTION'?'tag-a':'tag-e';
    const x=o.position?Number(o.position.x).toFixed(0):'?';
    const y=o.position?Number(o.position.y).toFixed(0):'?';
    h+='<tr><td>'+o.id+'</td><td><span class="tag '+cls+'">'+t+'</span></td><td>'+x+' , '+y+'</td></tr>';
  }
  h+='</table></div>';
  const t=(d.ts.split('T')[1]||'').split('.')[0];
  h+='<div class="live blink">● LIVE — tự cập nhật mỗi 2s (lần cuối '+t+')</div>';
  document.getElementById('wrap').innerHTML=h;
}
tick(); setInterval(tick,2000);
</script>
</body>
</html>
